<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion Test</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div style="padding: 2rem;">
        <h1>Accordion Test</h1>
        
        <article class="accordion">
            <button class="accordion__button" aria-expanded="false">
                <span class="accordion__read-text">Read more</span>
                <span class="accordion__close-text">Close</span>
                <img src="img/icons/chevron-right.svg" alt="Arrow right icon" class="accordion__icon" />
            </button>
            <div class="accordion__content">
                <p>This is the accordion content that should be hidden by default and shown when the button is clicked.</p>
            </div>
        </article>
        
        <br><br>
        
        <article class="accordion">
            <button class="accordion__button" aria-expanded="false">
                <span class="accordion__read-text">Loe edasi</span>
                <span class="accordion__close-text">Sulge</span>
                <img src="img/icons/chevron-right.svg" alt="Arrow right icon" class="accordion__icon" />
            </button>
            <div class="accordion__content">
                <p>Estonian version test content.</p>
            </div>
        </article>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
